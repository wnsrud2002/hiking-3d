<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hiking-3d · 승학산</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.19.0/dist/maplibre-gl.css">
<style>
  html, body, #map { margin: 0; height: 100%; }
  /* 기본 29px는 산에서 장갑 낀 손으로 누르기 어려움 → iOS 최소 터치 크기 44px */
  .maplibregl-ctrl-group button { width: 44px; height: 44px; }
  .maplibregl-ctrl-group button.txt { font-size: 18px; line-height: 44px; }
  .maplibregl-ctrl-group button.txt.on { color: #d6249f; }
  #status {
    position: absolute; left: 10px; bottom: 56px; padding: 6px 10px; border-radius: 6px;
    background: rgba(20, 20, 20, .85); color: #e6e6e6; font: 14px system-ui, sans-serif; display: none;
  }
  #notice {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    padding: 8px 14px; border-radius: 6px; background: rgba(20, 20, 20, .85);
    color: #e6e6e6; font: 14px system-ui, sans-serif; display: none;
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="notice" role="status" aria-live="polite"></div>
<div id="status" aria-live="polite"></div>
<script type="module">
// v6부터 ESM 전용이라 UMD <script src> 대신 import
import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.19.0/dist/maplibre-gl.mjs';

const START = [128.9798, 35.1168]; // 승학산 정상 (OSM, 497 m)
const ZOOM = 14, PITCH = 60, BEARING = -20;
const EXAGGERATION = 1.5; // 30 m DEM + 500 m 미만 산이라 1.0이면 밋밋함

const DEM = {
  type: 'raster-dem',
  tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
  encoding: 'terrarium', tileSize: 256, maxzoom: 15,
  attribution: '고도·등고선: <a href="https://registry.opendata.aws/terrain-tiles/">AWS Terrain Tiles</a> (Mapzen)',
};

const map = new maplibregl.Map({
  container: 'map',
  center: START, zoom: ZOOM, pitch: PITCH, bearing: BEARING, maxPitch: 85,
  style: {
    version: 8,
    // 등고선 높이 숫자용 글꼴. 실패해도 숫자만 안 보이고 나머지는 동작
    glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
    sources: {
      osm: {
        type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
        tileSize: 256, maxzoom: 19,
        attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      },
      // 지형과 음영이 같은 소스를 쓰면 MapLibre가 해상도 문제로 경고하므로 분리
      terrain: DEM,
      shade: DEM,
      // fetch_trails.py로 미리 받은 OSM 등산로 (Overpass를 매번 부르면 느리고 자주 실패)
      trails: { type: 'geojson', data: 'trails.geojson' },
      // make_contours.py로 고도 타일에서 미리 계산한 10 m 간격 등고선
      contours: { type: 'geojson', data: 'contours.geojson' },
      track: { type: 'geojson', data: { type: 'FeatureCollection', features: [] } },
    },
    layers: [
      { id: 'osm', type: 'raster', source: 'osm' },
      { id: 'hillshade', type: 'hillshade', source: 'shade', paint: { 'hillshade-exaggeration': 0.4 } },
      // 500 m 미만 산이라 100 m 계곡선은 4개뿐 → 50 m마다 굵게. 10 m 선은 멀리서 보면 뭉개지므로 줌 13 아래에선 숨김
      { id: 'contours', type: 'line', source: 'contours',
        paint: { 'line-color': '#7a5230',
                 'line-width': ['case', ['==', ['%', ['get', 'ele'], 50], 0], 1.4, 0.6],
                 'line-opacity': ['interpolate', ['linear'], ['zoom'],
                   12.5, ['case', ['==', ['%', ['get', 'ele'], 50], 0], 0.7, 0],
                   13.5, ['case', ['==', ['%', ['get', 'ele'], 50], 0], 0.7, 0.45]] } },
      // 어두운 테두리를 깔아야 초록 숲과 밝은 시가지 양쪽에서 다 보임
      { id: 'trails-casing', type: 'line', source: 'trails', layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: { 'line-color': '#3a1d00', 'line-opacity': 0.6,
                 'line-width': ['interpolate', ['linear'], ['zoom'], 12, 2.5, 16, 7] } },
      { id: 'trails', type: 'line', source: 'trails', layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: { 'line-color': '#ff7a1a',
                 'line-width': ['interpolate', ['linear'], ['zoom'], 12, 1.2, 16, 4] } },
      { id: 'contour-labels', type: 'symbol', source: 'contours', filter: ['==', ['%', ['get', 'ele'], 50], 0],
        layout: { 'symbol-placement': 'line', 'symbol-spacing': 300, 'text-field': ['concat', ['to-string', ['get', 'ele']], ' m'],
                  'text-font': ['Open Sans Semibold'], 'text-size': 11 },
        paint: { 'text-color': '#5a3a1e', 'text-halo-color': 'rgba(255, 255, 255, 0.85)', 'text-halo-width': 1.2 } },
      // 내 궤적: 주황 등산로·초록 숲과 구분되는 분홍
      { id: 'track-casing', type: 'line', source: 'track', layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: { 'line-color': '#ffffff', 'line-width': ['interpolate', ['linear'], ['zoom'], 12, 6, 16, 13] } },
      { id: 'track', type: 'line', source: 'track', layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: { 'line-color': '#d6249f', 'line-width': ['interpolate', ['linear'], ['zoom'], 12, 3.5, 16, 8] } },
    ],
    terrain: { source: 'terrain', exaggeration: EXAGGERATION },
  },
});
window.map = map;

map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }));
map.addControl(new maplibregl.ScaleControl());

const geo = new maplibregl.GeolocateControl({
  positionOptions: { enableHighAccuracy: true },
  trackUserLocation: true,
  showAccuracyCircle: true, // 산에서 GPS 오차가 수십 m라는 걸 눈으로 보이게
});
map.addControl(geo);

const notice = document.getElementById('notice');
function say(text) {
  notice.textContent = text;
  notice.style.display = 'block';
  clearTimeout(say.t);
  say.t = setTimeout(() => (notice.style.display = 'none'), 5000);
}
// 권한이 이미 꺼져 있으면 MapLibre는 버튼만 조용히 비활성화하고 error 이벤트를 안 보냄
navigator.permissions?.query({ name: 'geolocation' }).then((p) => {
  if (p.state === 'denied') say('위치 권한이 꺼져 있어 내 위치를 표시할 수 없습니다. 브라우저 설정에서 허용해 주세요.');
});
map.on('error', (e) => {
  if (e.sourceId === 'trails') say('등산로 데이터를 불러오지 못했습니다. 기본 지도의 점선만 표시됩니다.');
});
geo.on('error', (e) => {
  say(e.code === 1 ? '위치 권한이 거부되었습니다. 지도는 계속 쓸 수 있어요.' : '위치를 가져오지 못했습니다.');
});

// ── 진행 방향 화살표 ──
// MapLibre엔 방향 표시가 없어 직접 그림. 나침반을 우선 쓰고, 없으면 GPS 진행 방향(움직일 때만 값이 있음)
const arrowEl = document.createElement('div');
// 지도를 60° 기울이면 바닥에 눕힌 화살표가 납작해지고 파란 점(지름 약 20px)에 가려져서 크게, 점에서 떨어뜨려 그림
arrowEl.innerHTML = '<svg width="96" height="96" viewBox="0 0 96 96" aria-hidden="true">'
  + '<path d="M48 4 L66 40 L48 31 L30 40 Z" fill="#1a73e8" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/></svg>';
// 96px 정사각형의 중심 = 내 위치라서 회전해도 화살표가 점 주위를 돎
const arrow = new maplibregl.Marker({ element: arrowEl, rotationAlignment: 'map', pitchAlignment: 'map' });
let myPos = null, heading = null, compassOn = false, frame = 0;

function renderArrow() {
  if (frame) return;
  frame = requestAnimationFrame(() => { // 나침반 이벤트가 초당 60번 와서 그리기는 화면 갱신마다 한 번만
    frame = 0;
    if (myPos && heading != null) arrow.setLngLat(myPos).setRotation(heading).addTo(map);
  });
}

function onCompass(e) {
  const raw = e.webkitCompassHeading // iOS: 북쪽 기준 시계방향
    ?? (e.alpha != null && (e.absolute || e.type === 'deviceorientationabsolute') ? 360 - e.alpha : null); // 안드로이드: 반시계
  if (raw == null || isNaN(raw)) return;
  const h = (raw + (screen.orientation?.angle ?? 0)) % 360; // 가로 화면이면 기기 위쪽과 화면 위쪽이 다름
  // 센서 값이 떨려 화살표가 흔들림 → 20%씩만 따라감. 359°→0° 경계는 최단 방향 차이로 계산
  heading = compassOn ? (heading + ((h - heading + 540) % 360 - 180) * 0.2 + 360) % 360 : h;
  compassOn = true;
  renderArrow();
}

geo.on('geolocate', (pos) => {
  myPos = [pos.coords.longitude, pos.coords.latitude];
  if (!compassOn && pos.coords.heading != null && !isNaN(pos.coords.heading)) heading = pos.coords.heading;
  renderArrow();
});

// iOS는 나침반 권한을 버튼 누름(사용자 동작) 안에서만 요청할 수 있어 위치 버튼에 붙임
let compassAsked = false;
document.querySelector('.maplibregl-ctrl-geolocate').addEventListener('click', async () => {
  if (compassAsked) return;
  compassAsked = true;
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'
      && (await DeviceOrientationEvent.requestPermission().catch(() => 'denied')) !== 'granted') {
    return say('나침반 권한이 없어 걸을 때만 방향이 표시됩니다.');
  }
  addEventListener('ondeviceorientationabsolute' in window ? 'deviceorientationabsolute' : 'deviceorientation', onCompass);
});

// ── 궤적 기록 · GPX 저장/불러오기 ──
const KEY = 'hiking-3d:track';
const MAX_ACC = 50; // m. 숲·골짜기에서 튀는 점 제거
const MIN_STEP = 5; // m. 멈춰 있을 때 같은 자리에 점이 쌓이는 것 방지
let rec = JSON.parse(localStorage.getItem(KEY) || 'null') || { recording: false, points: [] };
let watchId = null, wakeLock = null;

function dist(a, b) { // 하버사인, m
  const r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2;
  return 2 * 6371000 * Math.asin(Math.sqrt(h));
}
const km = (pts) => pts.reduce((d, p, i) => (i ? d + dist(pts[i - 1], p) : 0), 0) / 1000;
const drawTrack = (pts) => map.getSource('track').setData({
  type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: pts.map((p) => [p.lon, p.lat]) } });

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(rec)); }
  catch { say('저장 공간이 가득 차 기록을 저장하지 못했습니다. 기록을 멈추고 GPX로 내려받으세요.'); }
}

function onPos(pos) {
  const { latitude: lat, longitude: lon, altitude: ele, accuracy } = pos.coords;
  if (accuracy > MAX_ACC) return;
  const p = { lat, lon, ele, t: pos.timestamp };
  const last = rec.points.at(-1);
  if (last && dist(last, p) < MIN_STEP) return;
  rec.points.push(p);
  save(); drawTrack(rec.points); updateStatus();
}

// 웹페이지는 화면이 꺼지면 GPS를 못 받으므로, 기록 중엔 화면을 켜 둠
async function keepAwake() {
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch { /* 미지원·저전력 모드 */ }
}
document.addEventListener('visibilitychange', () => {
  if (rec.recording && document.visibilityState === 'visible') keepAwake(); // 탭 전환 시 자동 해제되므로 다시 요청
});

function start(resume) {
  if (!navigator.geolocation) return say('이 브라우저는 위치 기능이 없어 기록할 수 없습니다.');
  if (!resume) rec = { recording: true, points: [] };
  rec.recording = true; save(); drawTrack(rec.points);
  watchId = navigator.geolocation.watchPosition(onPos, (e) => {
    say(`위치를 받지 못했습니다: ${e.message}`);
    if (e.code === 1) stop();
  }, { enableHighAccuracy: true });
  keepAwake(); updateStatus();
}

function stop() {
  navigator.geolocation.clearWatch(watchId); watchId = null;
  wakeLock?.release(); wakeLock = null;
  rec.recording = false; save(); updateStatus();
  if (rec.points.length) downloadGpx(rec.points);
  else say('기록된 점이 없습니다.');
}

function toGpx(pts) {
  const trkpts = pts.map((p) => `<trkpt lat="${p.lat.toFixed(6)}" lon="${p.lon.toFixed(6)}">`
    + (p.ele != null ? `<ele>${p.ele.toFixed(1)}</ele>` : '')
    + `<time>${new Date(p.t).toISOString()}</time></trkpt>`).join('\n');
  return `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="hiking-3d" xmlns="http://www.topografix.com/GPX/1/1">
<trk><name>hiking-3d ${new Date(pts[0].t).toISOString()}</name><trkseg>
${trkpts}
</trkseg></trk>
</gpx>
`;
}

function downloadGpx(pts) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([toGpx(pts)], { type: 'application/gpx+xml' }));
  a.download = `hiking-${new Date(pts[0].t).toLocaleString('sv-SE').replace(/\D/g, '').slice(0, 12)}.gpx`; // 현지 시각 YYYYMMDDhhmm
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  say(`GPX 저장: ${pts.length}개 점, ${km(pts).toFixed(2)} km`);
}

function loadGpx(text) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  const pts = [...doc.getElementsByTagName('trkpt')].map((e) => ({ lat: +e.getAttribute('lat'), lon: +e.getAttribute('lon') }));
  if (!pts.length || pts.some((p) => isNaN(p.lat) || isNaN(p.lon))) return say('GPX에서 경로(trkpt)를 찾지 못했습니다.');
  drawTrack(pts);
  const b = new maplibregl.LngLatBounds();
  pts.forEach((p) => b.extend([p.lon, p.lat]));
  map.fitBounds(b, { padding: 60, pitch: PITCH, bearing: map.getBearing() });
  say(`불러옴: ${pts.length}개 점, ${km(pts).toFixed(2)} km`);
}

const statusEl = document.getElementById('status');
const recBtn = Object.assign(document.createElement('button'), { type: 'button', className: 'txt' });
const loadBtn = Object.assign(document.createElement('button'), { type: 'button', className: 'txt', textContent: '📂', title: 'GPX 불러오기' });
loadBtn.setAttribute('aria-label', 'GPX 불러오기');
// accept=".gpx"를 주면 iOS가 GPX 파일을 회색으로 막는 경우가 있어 비워 두고 내용으로 검사
const fileIn = Object.assign(document.createElement('input'), { type: 'file', hidden: true });

function updateStatus() {
  const label = rec.recording ? '기록 중지하고 GPX 저장' : '궤적 기록 시작';
  Object.assign(recBtn, { textContent: rec.recording ? '■' : '●', title: label });
  recBtn.setAttribute('aria-label', label);
  recBtn.classList.toggle('on', rec.recording);
  statusEl.style.display = rec.recording ? 'block' : 'none';
  statusEl.textContent = `● 기록 중 · ${km(rec.points).toFixed(2)} km · ${rec.points.length}점`;
}

recBtn.onclick = () => (rec.recording ? stop() : start(false));
loadBtn.onclick = () => (rec.recording ? say('기록 중에는 불러올 수 없습니다.') : fileIn.click());
fileIn.onchange = async () => { if (fileIn.files[0]) loadGpx(await fileIn.files[0].text()); fileIn.value = ''; };
document.body.append(fileIn);
map.addControl({
  onAdd() {
    const div = Object.assign(document.createElement('div'), { className: 'maplibregl-ctrl maplibregl-ctrl-group' });
    div.append(recBtn, loadBtn);
    return div;
  },
  onRemove() {},
});
updateStatus();

// 산에서 신호가 약해도 열리도록 (sw.js). https·localhost에서만 동작
navigator.serviceWorker?.register('sw.js').catch(() => {});
addEventListener('offline', () => say('오프라인: 저장해 둔 지도·데이터만 표시됩니다.'));

map.on('load', () => {
  drawTrack(rec.points);
  if (rec.recording) { start(true); say('이전 기록을 이어서 기록합니다.'); } // 탭이 꺼졌다 다시 열린 경우
});
</script>
</body>
</html>
